name: Pages

# Publishes the project site to GitHub Pages: the landing page in docs/site
# at the root (#625), and the user guide in docs/guide under /guide/ (#553).
# Only main deploys, so the site always describes the latest release; work
# merged to develop goes live with the release that ships it. develop still
# BUILDS the site, so a change that breaks the build is caught before a
# release rather than at one. Only docs/site and docs/guide are published:
# docs/plans and the other internal docs never are.
# cmd/lmm/site_test.go holds this file to that layout.
on:
  push:
    branches: [main, develop]
    paths:
      - "docs/site/**"
      - "docs/guide/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch at a time, and a deploy is never cancelled part way.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The landing page first, so _site belongs to the runner: the Jekyll
      # step below runs in a container and leaves what it creates owned by
      # root, which a later copy into _site could not write over.
      - name: Copy the landing page
        run: |
          mkdir -p _site
          cp -R docs/site/. _site/
      # The guide's _config.yml sets baseurl /linux-mod-manager/guide to match.
      - name: Build the guide
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs/guide
          destination: ./_site/guide
      - name: Check the site
        run: |
          set -eu
          for f in index.html 404.html guide/index.html; do
            test -s "_site/$f" || { echo "::error::_site/$f is missing"; exit 1; }
          done
          # Every guide page builds, and its old root URL has a stub.
          for md in docs/guide/*.md; do
            page=$(basename "$md" .md)
            [ "$page" = index ] && continue
            test -s "_site/guide/$page.html" || { echo "::error::_site/guide/$page.html is missing"; exit 1; }
            test -s "_site/$page.html" || { echo "::error::_site/$page.html (the redirect stub) is missing"; exit 1; }
          done
          # Nothing internal leaked in.
          if [ -e _site/plans ] || [ -e _site/guide/plans ]; then
            echo "::error::docs/plans was published"; exit 1
          fi
          # The guide's links and assets resolve under /guide/.
          grep -q 'href="/linux-mod-manager/guide/' _site/guide/index.html || {
            echo "::error::the guide is not built for /linux-mod-manager/guide"; exit 1; }
      - name: Upload
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
