name: test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Via the Makefile so the race job and `make check` share one
      # timeout: Go's 10-minute per-binary default is shorter than the v2
      # suite under -race, and a bare `go test` here fails with
      # "panic: test timed out after 10m0s" and no failing assertion (#374).
      #
      # GOCACHE_LOCAL is overridden with the cache setup-go just restored:
      # the Makefile's default is a project-local directory for sandboxes
      # with no writable HOME, and taking it here would leave the restored
      # cache unused and recompile the module and its dependencies under
      # -race on every run (P1b review F7).
      - name: go test (race)
        run: make test-race GOCACHE_LOCAL=$(go env GOCACHE)
