name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The AUR deploy key. When the secret is not configured GitHub
          # substitutes an empty string, which .goreleaser.yaml's
          # aurs[0].skip_upload reads as "skip": the release still publishes
          # the tarballs and the deb/rpm/apk, it just does not push to the AUR.
          AUR_KEY: ${{ secrets.AUR_KEY }}
