# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: lmm

before:
  hooks:
    - go mod tidy
    - go fmt ./...
    - go vet ./...
    # Shell completions are generated, not committed: Cobra emits them from
    # the live command tree, so a generated-at-release copy can never drift
    # from the binary it ships beside. Written into ./completions (gitignored)
    # for the nfpms and aurs sections below to pick up.
    - sh -c 'mkdir -p completions && for shell in bash zsh fish; do go run ./cmd/lmm completion "$shell" > "completions/lmm.$shell"; done && chmod 0644 completions/*'
    # Man pages ARE committed (docs/man/man1, regenerated by `make man` and
    # guarded by cmd/lmm/genman_test.go), but nfpm does not compress them and
    # both dpkg and rpm expect /usr/share/man to be gzipped. Compress into
    # ./manpages (gitignored) rather than mutating the tracked tree.
    - sh -c 'mkdir -p manpages && for page in docs/man/man1/*.1; do gzip -9 -n -c "$page" > "manpages/$(basename "$page").gz"; done && chmod 0644 manpages/*'

builds:
  - id: lmm
    main: ./cmd/lmm
    binary: lmm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: lmm
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - docs/man/man1/**

nfpms:
  - id: lmm
    package_name: lmm
    ids:
      - lmm
    vendor: Donovan C. Young
    homepage: https://github.com/DonovanMods/linux-mod-manager
    maintainer: Donovan C. Young <dyoung522@gmail.com>
    license: MIT
    section: utils
    priority: optional
    description: |-
      Terminal-based mod manager for Linux.
      lmm searches, installs, updates and deploys game mods from NexusMods,
      CurseForge and user-defined custom sources, with per-game profiles,
      update policies and symlink/hardlink/copy deployment. Ships a CLI and
      a local browser UI (lmm serve) over the same engine.
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # No `file_info: mode:` anywhere below on purpose: nfpm copies each
    # entry's mode from its source file, every source here is 0644, and the
    # two `before` hooks chmod what they generate so that stays true under
    # any umask. Spelling the mode out instead would mean an octal literal,
    # which the repo's yamllint bans in either notation.
    contents:
      - src: manpages/*.1.gz
        dst: /usr/share/man/man1
      - src: completions/lmm.bash
        dst: /usr/share/bash-completion/completions/lmm
      - src: completions/lmm.zsh
        dst: /usr/share/zsh/site-functions/_lmm
      - src: completions/lmm.fish
        dst: /usr/share/fish/vendor_completions.d/lmm.fish
      - src: README.md
        dst: /usr/share/doc/lmm/README.md
      - src: CHANGELOG.md
        dst: /usr/share/doc/lmm/CHANGELOG.md
      # Shipped as a plain file, not `type: license`: nfpm's deb packager
      # drops license-typed entries entirely (verified against the built
      # package's data.tar), while rpm keeps them. A plain file lands in all
      # three formats; the only thing given up is rpm's %license marking.
      - src: LICENSE
        dst: /usr/share/doc/lmm/LICENSE
    # .7z and .rar mod archives are extracted by shelling out to the system
    # tool; .zip is native Go. Soft dependencies, never hard ones - lmm is
    # fully usable without them, and each ecosystem names them differently.
    overrides:
      deb:
        recommends:
          - p7zip-full
      rpm:
        recommends:
          - p7zip

aurs:
  - name: lmm-bin
    ids:
      - lmm
    homepage: https://github.com/DonovanMods/linux-mod-manager
    description: Terminal-based mod manager for Linux - CLI and local web UI for NexusMods, CurseForge and custom sources
    maintainers:
      - Donovan C. Young <dyoung522@gmail.com>
    license: MIT
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/lmm-bin.git
    # A release without the AUR deploy key still has to succeed: the secret
    # is the owner's to add, and until it exists this section publishes
    # nothing rather than failing the whole run.
    skip_upload: '{{ if index .Env "AUR_KEY" }}false{{ else }}true{{ end }}'
    provides:
      - lmm
    conflicts:
      - lmm
    optdepends:
      - "p7zip: extract .7z mod archives"
      - "unrar: extract .rar mod archives"
    package: |-
      install -Dm755 "./lmm" "${pkgdir}/usr/bin/lmm"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/lmm-bin/LICENSE"
      install -Dm644 "./README.md" "${pkgdir}/usr/share/doc/lmm/README.md"
      install -Dm644 "./CHANGELOG.md" "${pkgdir}/usr/share/doc/lmm/CHANGELOG.md"

      for page in ./docs/man/man1/*.1; do
        install -Dm644 "$page" "${pkgdir}/usr/share/man/man1/$(basename "$page")"
      done

      ./lmm completion bash | install -Dm644 /dev/stdin "${pkgdir}/usr/share/bash-completion/completions/lmm"
      ./lmm completion zsh | install -Dm644 /dev/stdin "${pkgdir}/usr/share/zsh/site-functions/_lmm"
      ./lmm completion fish | install -Dm644 /dev/stdin "${pkgdir}/usr/share/fish/vendor_completions.d/lmm.fish"

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  github:
    owner: DonovanMods
    name: linux-mod-manager
  draft: true
  prerelease: auto
  name_template: v{{ .Version }}
