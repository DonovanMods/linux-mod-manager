# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.27.1
    - node@25.4.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - svgo@4.1.0
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - taplo@0.10.0
    - grype@0.119.0
    - pinact@5.0.0
    - actionlint@1.7.12
    - gofmt@1.20.4
    - golangci-lint2@2.13.2
    - markdownlint@0.49.1
    - checkov@3.3.19
    - git-diff-check
    - osv-scanner@2.6.0
    - prettier@3.9.8
    - trufflehog@3.97.5
    - yamllint@1.38.0
  definitions:
    - name: pinact
      commands:
        # The pinned upstream adapter still passes v4's one-dash long flags.
        # Keep its token handling, SARIF normalization, and failure reporting.
        - name: lint
          run: python3 ${workspace}/.trunk/pinact_v5_run.py ${plugin}/linters/pinact/pinact_run.py ${target}
        - name: upgrade
          run: python3 ${workspace}/.trunk/pinact_v5_run.py ${plugin}/linters/pinact/pinact_run.py --upgrade ${target}
  ignore:
    - linters: [ALL]
      paths:
        # Generated Docs
        - docs/**
        # Vendored, pinned third-party browser libraries - kept byte-exact
        # against their upstream artifacts (see each file's header), so no
        # formatter or linter may rewrite them.
        - internal/serve/vendor/**

actions:
  disabled:
    - git-lfs
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
