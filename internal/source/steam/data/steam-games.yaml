# --- #406 story S1: Steam Workshop-native games -----------------------------
# Human Host - Unity/Mono survival game with Steam Workshop support on the
# store page; the community's mods are BepInEx plugins, and both the in-game
# mod browser and the community mod manager sync subscribed Workshop items
# into the BepInEx plugins folder inside the game install. No NexusMods
# game page exists for it, so steamworkshop is the only source.
# Installing the BepInEx loader itself is a prerequisite lmm does not
# manage yet (#359); the path below is where mods go once it is there.
# https://store.steampowered.com/app/2393970/Human_Host/
# https://steamcommunity.com/app/2393970/workshop/
# https://steamcommunity.com/sharedfiles/filedetails/?id=3740140784
"2393970":
  slug: human-host
  name: Human Host
  mod_path: BepInEx/plugins
  sources:
    steamworkshop: "2393970"

# --- #406 story S2: NexusMods-centred games ---------------------------------
# Cyberpunk 2077 - a mod archive's own archive/, bin/ and r6/ trees merge
# with the install's, so the mod root IS the game root; .archive files land
# under archive/pc/mod, REDmods under mods/, plugins under bin/x64/plugins.
# https://wiki.redmodding.org/cyberpunk-2077-modding/for-mod-users/users-modding-cyberpunk-2077
"1091500":
  slug: cyberpunk2077
  name: Cyberpunk 2077
  nexus_id: cyberpunk2077
  mod_path: ""
# Valheim - Unity/Mono; every mod is a BepInEx plugin dropped in
