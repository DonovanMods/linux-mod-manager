# significant to Unreal, not a typo). UE4SS script mods live in
# StarRupture/Binaries/Win64 and are not managed here.
# https://www.nexusmods.com/starrupture/mods/89
# https://www.thegamer.com/starrupture-best-mods-installing/
"1631270":
  slug: starrupture
  name: StarRupture
  nexus_id: starrupture
  mod_path: StarRupture/Content/Paks/~mods
# Windrose - Unreal Engine; the project directory is R5, so single-player
# mods go in <install>/R5/Content/Paks/~mods. A dedicated server keeps a
# second copy under R5/Builds/WindowsServer; lmm deploys to the client one.
# https://www.nexusmods.com/windrose/articles/4
# https://www.gamehostbros.com/guides/games/windrose/install-mods
"3041230":
  slug: windrose
  name: Windrose
  nexus_id: windrose
  mod_path: R5/Content/Paks/~mods
# Cubic Odyssey - since update 1.0.2 the game reads an additive mod folder,
# <install>/modded/data, mirroring the layout of its own data/ tree. That
# is the drop folder here; the older technique of replacing files inside
# data/configs edits the game's own files and is not something lmm should
# be pointed at. Unlike ~mods and BepInEx/plugins, which are scanned
# recursively, this folder is read by path: the archive's inner tree must
# mirror the game's own data/ layout, so a mod packed inside a wrapper
# folder extracts cleanly and then silently does nothing.
# https://www.nexusmods.com/cubicodyssey/mods/16
"3400000":
  slug: cubic-odyssey
  name: Cubic Odyssey
  nexus_id: cubicodyssey
  mod_path: modded/data
