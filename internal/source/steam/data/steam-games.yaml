# Steam App ID -> lmm game info for "lmm game detect".
# Add or override entries in ~/.config/lmm/steam-games.yaml without rebuilding.
# Keys are Steam App IDs (strings). mod_path is relative to game install (empty = game root).
# nexus_id is optional (omit for games with no NexusMods presence, e.g. Icarus).
# deploy_mode and sources are optional passthroughs to the generated
# games.yaml entry's own deploy_mode/sources (see docs/configuration.md);
# omit both to get today's default shape ({nexusmods: <nexus_id>}, deploy_mode extract).
# A sources: map REPLACES the {nexusmods: <nexus_id>} derivation rather than
# adding to it - it is the game's COMPLETE source set - so an entry that has
# both nexus_id and a sources map must spell nexusmods: out inside the map,
# with the same value. Omitting it there would silently drop NexusMods from a
# game that has one (#409 review F3); the well-formedness ratchet
# (internal/app/known_games_test.go) refuses that shape.
# loader is optional too: {kind: bepinex} for a game whose mods need a mod
# loader, which detection writes into the generated entry's own loader block
# (#416). Only kind and version belong here - runtime and bootstrap are facts
# about a particular INSTALL, which `lmm game show` reads off the game
# directory, and a version pinned here would be compared against the pack the
# user actually installed, so leave it out.
"489830":
  slug: skyrim-se
  name: Skyrim Special Edition
  nexus_id: skyrimspecialedition
  mod_path: Data
