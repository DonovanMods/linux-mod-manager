# --- #409: Thunderstore-first communities -----------------------------------
# The mapped value is the community slug in a thunderstore.io/c/<slug>/ URL.
# It is NOT derivable from the Steam app id and is not always lmm's own game
# id either (Risk of Rain 2 is `risk-of-rain-2` here and `riskofrain2`
# there), so it is curated rather than guessed - a wrong guess would
# silently index another game's catalogue. Add your own in
# ~/.config/lmm/steam-games.yaml; that file is merged over this one.
# Valheim (892970) and For The King (527230) are Thunderstore communities
# too; they sit with the NexusMods-centred entries above because they have a
# NexusMods page as well.
#
# Every entry below is a BepInEx game whose mods install into the GAME ROOT,
# which is what mod_path: "" means, and each declares the loader (#416) for
# the same reason the entries above do: detection writes the block into
# games.yaml so the first plugin install is not refused by #359's
# precondition. Declaring it does not claim BepInEx is INSTALLED - `lmm game
# show` reports that, and verify flags a declared-but-absent loader - so the
# user without it is told rather than silently deployed to.
# None carries a nexus_id: these games' catalogues are on Thunderstore, and
# an unverified NexusMods domain would be the same class of guess the
# community slug refuses.
# https://thunderstore.io/c/lethal-company/
# https://thunderstore.io/c/riskofrain2/
# https://thunderstore.io/c/repo/
# https://thunderstore.io/c/content-warning/
"1966720":
  slug: lethal-company
  name: Lethal Company
  mod_path: ""
  loader:
    kind: bepinex
  sources:
    thunderstore: lethal-company
"632360":
  slug: risk-of-rain-2
  name: Risk of Rain 2
  mod_path: ""
  loader:
    kind: bepinex
  sources:
    thunderstore: riskofrain2
