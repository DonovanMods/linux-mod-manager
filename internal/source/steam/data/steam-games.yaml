# --- #406 story S1: Steam Workshop-native games -----------------------------
# Human Host - Unity/Mono survival game with Steam Workshop support on the
# store page; the community's mods are BepInEx plugins, and both the in-game
# mod browser and the community mod manager sync subscribed Workshop items
# into the loader's plugins folder inside the game install. No NexusMods
# game page exists for it, so steamworkshop is the only source.
# BepInEx content is GAME-ROOT-relative - a pack lays down BepInEx/ with
# plugins/, patchers/ and config/ under it - so mod_path is "" (the install
# root) and #358's normaliser rewrites a plugin archive to that layout.
# The loader: block below declares that prerequisite (#416), so detection
# writes it into games.yaml and the first plugin install is not refused
# (#359). lmm does not INSTALL BepInEx - that is still yours to do; `lmm game
# show` says whether it is there and which launch option to paste.
# https://store.steampowered.com/app/2393970/Human_Host/
# https://steamcommunity.com/app/2393970/workshop/
# https://steamcommunity.com/sharedfiles/filedetails/?id=3740140784
"2393970":
  slug: human-host
  name: Human Host
  mod_path: ""
  loader:
    kind: bepinex
  sources:
    steamworkshop: "2393970"

